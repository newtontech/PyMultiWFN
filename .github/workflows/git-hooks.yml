name: Git Hooks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --hook-stage pre-commit

  pre-push:
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pre-push hooks
        run: pre-commit run --all-files --hook-stage pre-push

      - name: Verify reference assets stay out of wheel
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")

          with zipfile.ZipFile(wheels[-1]) as wheel:
              reference_entries = [
                  name
                  for name in wheel.namelist()
                  if "Multiwfn_3.8" in name
              ]

          if reference_entries:
              raise SystemExit(
                  "Reference Multiwfn assets leaked into wheel: "
                  + ", ".join(reference_entries[:10])
              )

          print("Reference Multiwfn assets are not included in the wheel.")
          PY
