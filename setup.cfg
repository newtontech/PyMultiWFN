[flake8]
# Max line length for black compatibility
max-line-length = 88

# Exclude common patterns
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    build,
    dist,
    *.egg-info,
    .pytest_cache,
    .mypy_cache,
    htmlcov,
    .tox,
    Multiwfn_3.8_bin_Linux_noGUI,
    Multiwfn_3.8_dev_src_Linux_2025-Nov-23,
    consistency_verifier,
    nightly-development,

# Ignore specific errors
ignore =
    # E203: Whitespace before ':' (conflicts with black)
    E203,
    # E501: Line too long (handled by black)
    E501,
    # W503: Line break before binary operator (conflicts with black)
    W503,
    # F401: Imported but unused (use selectively)
    # F811: Redefinition of unused name (allow type hints)
    F811,

# Per-file ignores
per-file-ignores =
    __init__.py:F401
    */test*.py:
        # Allow longer lines in tests
        E501,
        # Allow unused imports in tests
        F401,
        F811

# Enable selected plugins
enable-extensions =
    # Check for confusing code constructs
    C90,

[mypy]
# Python version to target
python_version = 3.10

# Warn about missing type annotations
warn_return_any = True
warn_unused_configs = True

# Disallow untyped definitions
disallow_untyped_defs = False
disallow_incomplete_defs = True

# Check untyped function definitions
check_untyped_defs = True

# Warn about unused ignores
warn_unused_ignores = True

# Show error codes
show_error_codes = True

# Error summary
show_error_context = True

# Exclude directories from checking
exclude =
    (?x)(
        (^|/)build/
        | (^|/)dist/
        | (^|/)\.git/
        | (^|/)\.venv/
        | (^|/)venv/
        | (^|/)env/
        | (^|/).*\.egg-info/
        | (^|/)\.pytest_cache/
        | (^|/)\.mypy_cache/
        | (^|/)htmlcov/
        | (^|/).*\.tox/
        | (^|/)Multiwfn_3.8/
        | (^|/)nightly-development/
        | (^|/)consistency_verifier/
        | (^|/)_\d+round-iteration/
    )

# Per-module settings
[mypy-tests.*]
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-pymultiwfn.math.fortran.*]
ignore_errors = True

[mypy-pymultiwfn.math.jit_functions]
ignore_errors = True

[coverage:run]
# Source directories to measure coverage
source = pymultiwfn

# Branch coverage
branch = True

# Parallel execution
parallel = True

# Omit files from coverage
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*
    */dist/*
    */build/*
    */.*egg-info/*
    pymultiwfn/math/fortran/*
    pymultiwfn/__init__.py
    pymultiwfn/main.py
    */Multiwfn_3.8/*
    */nightly-development/*
    */consistency_verifier/*

[coverage:paths]
# Map source files for coverage
source =
    pymultiwfn
    */site-packages/pymultiwfn

[coverage:report]
# Coverage precision
precision = 2

# Show missing lines
show_missing = True

# Skip covered files
skip_covered = False

# Exclude lines from coverage
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise NotImplementedError
    raise AssertionError
    if TYPE_CHECKING
    if typing.TYPE_CHECKING
    class.*[Pp]rotocol.*:
    @typing.Protocol
    @abc.abstractmethod
    if __name__ == .__main__.:
    assert False
    if sys.platform == .win.:
    if sys.platform == .darwin.:
    if sys.platform.startswith('linux')
    if DEBUG
    if __debug__
    except ImportError
    except ModuleNotFoundError

[coverage:html]
# HTML coverage report directory
directory = htmlcov

# Coverage report title
title = PyMultiWFN Test Coverage Report

[coverage:xml]
# XML coverage report file
output = coverage.xml

[bdist_wheel]
# Universal wheel (for pure Python packages)
universal = 0
