[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymultiwfn"
version = "0.1.2"
description = "Python-first refactor of Multiwfn wavefunction analysis program"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "PyMultiWFN Team"}
]
keywords = ["quantum-chemistry", "wavefunction", "analysis", "multiwfn", "computational-chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "numba>=0.55",
    "PyQt5>=5.15",
    "plotly>=5.0",
    "pyvista>=0.35"
]

[project.urls]
"Homepage" = "https://github.com/pymultiwfn/pymultiwfn"
"Bug Tracker" = "https://github.com/pymultiwfn/pymultiwfn/issues"
"Documentation" = "https://pymultiwfn.github.io/docs"

[project.scripts]
pymultiwfn = "pymultiwfn.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymultiwfn*"]

[tool.setuptools.package-data]
pymultiwfn = [
    "math/fortran/*"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.0",  # Parallel testing
    "pytest-timeout>=2.0",  # Test timeout
    "pytest-rerunfailures>=13.0",  # Rerun flaky tests
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test discovery and collection
addopts = "-v -l -ra -W default --strict-markers"

# Parallel testing and coverage (can be overridden on command line)
# Example: pytest --cov=pymultiwfn -n auto
#          pytest --no-cov -n 4
#          pytest -m "not slow"  # Skip slow tests

# Markers for test categorization
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests requiring external resources",
    "slow: Slow-running tests",
    "requires_data: Tests requiring test data files",
    "benchmark: Performance benchmarking tests",
    "expensive: Tests that require significant computational resources",
]

# Coverage configuration
[tool.coverage.run]
source = ["pymultiwfn"]
branch = true
parallel = true

[tool.coverage.paths]
source = [
    "pymultiwfn",
    "*/site-packages/pymultiwfn",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Test timeout configuration
[tool.pytest_timeout]
timeout = 600
method = "thread"
