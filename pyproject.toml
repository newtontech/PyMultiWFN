[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymultiwfn"
version = "0.1.2"
description = "Python-first refactor of Multiwfn wavefunction analysis program"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "PyMultiWFN Team"}
]
keywords = ["quantum-chemistry", "wavefunction", "analysis", "multiwfn", "computational-chemistry"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "numba>=0.55",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "build>=1.0",
    "flake8>=7.0",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=9.1.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.0",
    "pytest-timeout>=2.0",
    "pytest-rerunfailures>=13.0",
]
visualization = [
    "matplotlib>=3.5",
    "plotly>=5.0",
    "pyvista>=0.35",
]
gui = [
    "PyQt5>=5.15",
]
all = [
    "matplotlib>=3.5",
    "plotly>=5.0",
    "pyvista>=0.35",
    "PyQt5>=5.15",
]

[project.urls]
"Homepage" = "https://github.com/pymultiwfn/pymultiwfn"
"Bug Tracker" = "https://github.com/pymultiwfn/pymultiwfn/issues"
"Documentation" = "https://pymultiwfn.github.io/docs"

[project.scripts]
pymultiwfn = "pymultiwfn.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymultiwfn*"]

[tool.setuptools.package-data]
pymultiwfn = [
    "math/fortran/*"
]

[dependency-groups]
dev = [
    "black>=24.0",
    "build>=1.0",
    "flake8>=7.0",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "pytest>=9.1.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "pytest-xdist>=3.0",  # Parallel testing
    "pytest-timeout>=2.0",  # Test timeout
    "pytest-rerunfailures>=13.0",  # Rerun flaky tests
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Test discovery and collection
addopts = [
    "-v",                          # Verbose output
    "-l",                          # Show local variables in tracebacks
    "-ra",                         # Summary of all test results
    "-W default",                   # Show all warnings
    "--strict-markers",            # Strict marker validation
    "--strict-config",             # Strict config validation
    "--tb=short",                  # Short traceback format
    "--cov-report=term-missing:skip-covered",  # Show missing lines in terminal
    "--cov-report=html:htmlcov",   # Generate HTML coverage report
    "--reruns=2",                  # Rerun failed tests 2 times
    "--reruns-delay=1",            # Delay between reruns (1 second)
    "--timeout=600",               # Timeout for each test (600 seconds)
]

# Parallel testing and coverage (can be overridden on command line)
#
# Usage examples:
#   pytest --cov=pymultiwfn -n auto           # Run tests with coverage, auto-detect CPU cores
#   pytest --no-cov -n 4                       # Run tests with 4 workers, skip coverage
#   pytest -m "not slow" -n auto               # Skip slow tests, run in parallel
#   pytest tests/unit/test_density.py         # Run single file
#   pytest -v -l --tb=short                    # Verbose with detailed tracebacks
#   pytest -m "unit" -n auto                   # Run only unit tests in parallel
#   pytest -m "not expensive" -n 4            # Skip expensive tests, 4 workers

# Markers for test categorization
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests requiring external resources",
    "slow: Slow-running tests",
    "requires_data: Tests requiring test data files",
    "reference: Tests comparing against bundled Multiwfn reference data",
    "visualization: Tests requiring optional visualization dependencies",
    "benchmark: Performance benchmarking tests",
    "expensive: Tests that require significant computational resources",
]

# Coverage configuration
[tool.coverage.run]
source = ["pymultiwfn"]
branch = true
parallel = true

[tool.coverage.paths]
source = [
    "pymultiwfn",
    "*/site-packages/pymultiwfn",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Test timeout configuration
[tool.pytest_timeout]
timeout = 600
method = "thread"
