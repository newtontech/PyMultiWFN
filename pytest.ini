[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Basic options
addopts =
    -v
    -l
    -ra
    -W default
    --strict-markers
    --tb=short

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests requiring external resources
    slow: Slow-running tests
    requires_data: Tests requiring test data files
    benchmark: Performance benchmarking tests
    expensive: Tests that require significant computational resources

# Test isolation and parallelization options
# (use -n auto for parallel testing, --no-cov to skip coverage)
# Example commands:
#   pytest -n auto --cov=pymultiwfn           # Parallel with coverage
#   pytest -n 4 --cov-report=html             # 4 workers with HTML report
#   pytest -m "not slow" -n auto              # Skip slow tests, parallel
#   pytest tests/unit/test_density.py        # Single file
